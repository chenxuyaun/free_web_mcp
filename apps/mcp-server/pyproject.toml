[project]
name = "free-web-mcp"
version = "0.4.0"
description = "Free Web MCP - MCP server providing free web search and web fetch tools"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10,<2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "trafilatura>=2.0",
    "ddgs>=9.0",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "playwright>=1.62.0",
]

[project.scripts]
free-web-mcp = "free_web_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/free_web_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
