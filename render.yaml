services:
  # Next.js dashboard + evidence API (M1C)
  - type: web
    name: free-web-mcp-web
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @free-web-mcp/web build"
    startCommand: "cd apps/web && pnpm exec next start -p ${PORT:-3000} -H 0.0.0.0"
    # basePath is /webmcp, so the dashboard health route lives under it
    healthCheckPath: /webmcp/api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: Free Web MCP
      - key: BSC_NETWORK
        value: bsc-testnet
      - key: BSC_RPC_URL
        value: https://bsc-testnet-rpc.publicnode.com
      - key: BSC_EXPLORER_URL
        value: https://testnet.bscscan.com
      - key: EVIDENCE_REGISTRY_ADDRESS
        sync: false   # 0x19AB142cA0Aad02BB55ffB6129494926c520c60F (live BSC Testnet)
      - key: VERI_TOKEN_ADDRESS
        sync: false   # 0xDDcbC86dE41bB8863a4Acd929E965d0E07A54C76 (live BSC Testnet)
      - key: WALLET_PRIVATE_KEY
        sync: false   # testnet signer — set in Render dashboard, NEVER commit
      - key: MCP_SERVER_URL
        value: https://free-web-mcp-mcp.onrender.com

  # Python MCP server (Streamable HTTP, 16 tools)
  - type: web
    name: free-web-mcp-mcp
    runtime: python
    plan: free
    branch: main
    rootDir: apps/mcp-server
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run --no-sync free-web-mcp --transport http --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SEARCH_PROVIDER
        value: auto
      - key: EVIDENCE_API_URL
        value: https://free-web-mcp-web.onrender.com/webmcp
