# free_web_mcp × yuncai.site —— nginx 反代片段
#
# 用法（124 服务器上，nginx 已在跑）：
#   sudo cp deploy/124/nginx-yuncai-webmcp.conf /etc/nginx/snippets/free-web-mcp.conf
#   然后在 yuncai.site 的 server 块里 include：
#     include snippets/free-web-mcp.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 之后 prompt-helper 的设置填：
#   MCP 服务地址  = https://yuncai.site/mcp
#   看板地址      = https://yuncai.site/webmcp

# ── 证据看板（Next.js, basePath /webmcp）──────────────────────
location /webmcp/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# ── MCP 服务器（Streamable HTTP: POST /mcp，SSE 响应）─────────
location = /mcp {
    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE：关缓冲、长读超时（搜索+抓取一轮可能 1-2 分钟）
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ── 健康检查（可选暴露，便于远程探活）────────────────────────
location = /mcp-health {
    proxy_pass http://127.0.0.1:10000/health;
    proxy_set_header Host $host;
}
