# free_web_mcp × yuncai.site —— nginx 反代片段（含访问密钥闸门）
#
# 用法（124 服务器上，nginx 已在跑）：
#   把本文件放到 /etc/nginx/snippets/free-web-mcp.conf，替换 <API_KEY> 为真实密钥，
#   并在 yuncai.site 的 443 server 块里 include 它：include snippets/free-web-mcp.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 之后 prompt-helper 的设置填：
#   MCP 服务地址  = https://yuncai.site/mcp
#   看板地址      = https://yuncai.site/webmcp
#   访问密钥      = <API_KEY>
#
# 闸门策略（为什么这样切）：
#   · /mcp 全部方法都要密钥 —— 那是机器接口，匿名访问等于把服务器当免费搜索代理，
#     还能写证据库、并调锚定花掉签名钱包的 gas。
#   · /webmcp/api/ 只挡写方法（非 GET/HEAD/OPTIONS）—— 读接口保持开放，
#     你自己的看板页面才能正常显示；花钱与改状态的那些路由必须带密钥。
#   · 静态页面（/webmcp/ 下的 HTML/JS）不挡。

# ── 证据看板：写方法需密钥，读方法放行 ────────────────────────
location /webmcp/api/ {
    set $fwm_deny "";
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { set $fwm_deny "w"; }
    if ($http_x_api_key != "<API_KEY>") { set $fwm_deny "${fwm_deny}k"; }
    if ($fwm_deny = "wk") { return 401; }

    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# ── 证据看板：页面与静态资源（不挡）───────────────────────────
location /webmcp/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# ── MCP 服务器（Streamable HTTP: POST /mcp，SSE 响应）─────────
# 应用层已有 MCP_API_KEY 闸门（未授权返回 401）；这里是边缘第二道，
# 让匿名流量根本到不了进程。两处用同一个密钥。
location = /mcp {
    if ($http_x_api_key != "<API_KEY>") { return 401; }

    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE：关缓冲、长读超时（搜索+抓取一轮可能 1-2 分钟）
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ── 健康检查（保持开放，供监控探活）──────────────────────────
location = /mcp-health {
    proxy_pass http://127.0.0.1:10000/health;
    proxy_set_header Host $host;
}
